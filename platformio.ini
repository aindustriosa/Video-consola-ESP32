; Proxecto PlatformIO da videoconsola.
; O teu programa vai na carpeta "xogo/". Para probar un exemplo, copia o seu
; ficheiro .ino dentro de "xogo/" (substituíndo o que haxa).
;
;   pio run                 -> compilar
;   pio run -t upload       -> compilar e gravar na consola (USB-C)
;   pio device monitor      -> ver as mensaxes de Serial.print()

[platformio]
src_dir = xogo

[env:videoconsola]
platform = espressif32 @ 6.5.0
board = seeed_xiao_esp32c3
framework = arduino
lib_deps = lovyan03/LovyanGFX @ ^1.1.16
build_flags = -DCORE_DEBUG_LEVEL=0
monitor_speed = 115200

; O USB do ESP32-C3 non sempre aguanta a gravación rápida de esptool.
; Gravamos a 115200 baudios e sen "stub", que é o modo que funciona sempre.
upload_speed = 115200
upload_command = $PYTHONEXE $UPLOADER --chip esp32c3 --port $UPLOAD_PORT --baud 115200 --no-stub --before default_reset --after hard_reset write_flash 0x0 $BUILD_DIR/bootloader.bin 0x8000 $BUILD_DIR/partitions.bin 0xe000 ${platformio.packages_dir}/framework-arduinoespressif32/tools/partitions/boot_app0.bin 0x10000 $SOURCE
